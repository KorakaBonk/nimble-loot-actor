name: Release

# Push a tag such as v1.0.0, publish a release for one, or run this workflow
# by hand on main (it then tags the version in module.json) to build the
# module and attach module.json and module.zip to the GitHub release.
on:
  push:
    tags: ['v*']
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      TAG: ${{ github.event.release.tag_name || (github.event_name != 'workflow_dispatch' && github.ref_name) || '' }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.TAG || github.ref }}

      - name: Take the tag from module.json for a manual run
        if: github.event_name == 'workflow_dispatch'
        run: |
          TAG="v$(jq -r .version module.json)"
          if git ls-remote --exit-code --tags origin "refs/tags/$TAG" > /dev/null; then
            echo "::error::$TAG already exists; bump the version in module.json first"
            exit 1
          fi
          echo "TAG=$TAG" >> "$GITHUB_ENV"

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Test
        run: npm test && npm run check

      - name: Check the tag matches module.json
        run: |
          VERSION="$(jq -r .version module.json)"
          if [ "v$VERSION" != "$TAG" ]; then
            echo "::error::Tag $TAG does not match module.json version $VERSION"
            exit 1
          fi

      - name: Point the download at this release
        run: |
          jq --arg d "https://github.com/${{ github.repository }}/releases/download/${TAG}/module.zip" \
             '.download = $d' module.json > module.tmp && mv module.tmp module.json

      - name: Package
        run: zip -r module.zip module.json scripts templates styles lang assets README.md CHANGELOG.md LICENSE

      - name: Create the release if needed and upload assets
        run: |
          if ! gh release view "$TAG" > /dev/null 2>&1; then
            NOTES="$(awk -v v="${TAG#v}" '$0 == "## " v {f=1; next} /^## /{f=0} f' CHANGELOG.md)"
            if [ "${{ github.event_name }}" = workflow_dispatch ]; then
              gh release create "$TAG" --title "$TAG" --notes "$NOTES" --target "$GITHUB_SHA"
            else
              gh release create "$TAG" --title "$TAG" --notes "$NOTES" --verify-tag
            fi
          fi
          gh release upload "$TAG" module.json module.zip --clobber
